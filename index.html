<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Household To-Do</title>
<style>
:root{--bg:#faf6f0;--card:#fff;--ink:#2d2a26;--muted:#8a8279;--line:#ece5da;--accent:#c9714b;--accent-soft:#f7e6dc;--ok:#5b8f6a;--bad:#c2410c;--bad-soft:#fde8df;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:max(16px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
main{max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 14px}
h1{font-size:1.6rem;margin:0;letter-spacing:-.01em}
#status{font-size:.8rem;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
#status.ok::before{content:"✓ ";color:var(--ok)}
#status.busy::before{content:"↻ "}
#status.bad{color:var(--bad);border-color:#f3c9b5}
#status.bad::before{content:"⚠ "}
input,select,button{font:inherit;color:inherit}
input[type=text],input[type=date],select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fffdfa}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
section.owner{margin-top:18px}
section.owner>h2{font-size:1.05rem;margin:0 2px 8px;display:flex;align-items:baseline;gap:8px}
.count{font-size:.8rem;color:var(--muted);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:6px;padding:2px 6px 2px 6px;border-top:1px solid var(--line)}
.card>.item:first-child,.card>div:first-child .item{border-top:0}
.chk{flex:none;width:44px;height:44px;display:grid;place-items:center;background:none;border:0;cursor:pointer;padding:0}
.chk i{width:24px;height:24px;border:2px solid #cfc6b9;border-radius:50%;display:grid;place-items:center;font-style:normal;color:#fff;font-size:15px;line-height:1;transition:.12s}
.chk:hover i{border-color:var(--accent)}
.done .chk i{background:var(--ok);border-color:var(--ok)}
.body{flex:1;min-width:0;background:none;border:0;text-align:left;padding:10px 4px;cursor:pointer;overflow-wrap:anywhere}
.done .txt{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap}
.chip{font-size:.74rem;padding:1px 8px;border-radius:99px;background:#f3eee6;color:#6b645b}
.chip.over{background:var(--bad-soft);color:var(--bad);font-weight:700}
.chip.today{background:#fff3cf;color:#8a6100;font-weight:600}
.item.overdue{background:#fff7f3;box-shadow:inset 3px 0 0 var(--bad)}
.edit{padding:10px 12px 12px;border-top:1px solid var(--line);background:#fffaf4;display:grid;gap:8px}
.edit .btns{display:flex;gap:8px}
.edit button{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
.edit .del{margin-left:auto;color:var(--bad)}
.edit .save{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{padding:14px;color:var(--muted);font-size:.92rem}
.grip{flex:none;width:36px;height:44px;display:grid;place-items:center;background:none;border:0;padding:0;margin-right:-2px;color:#a39a8d;font-size:18px;line-height:1;letter-spacing:-2px;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.grip:hover,.grip:focus-visible{color:var(--accent)}
body.dragging,body.dragging *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
.card.target{box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.ph{background:var(--accent-soft);border-top:1px solid var(--line)}
.iw.lifted{position:fixed;z-index:50;margin:0;background:#fff;box-shadow:0 8px 22px rgba(45,42,38,.22);border-radius:10px;outline:2px solid var(--accent);outline-offset:-2px}
.edit .mv{min-width:44px;padding:0 12px}
.edit .mvlbl{font-size:.8rem;color:var(--muted);align-self:center}
details.doneBox{margin-top:22px}
details.doneBox>summary{cursor:pointer;color:var(--muted);padding:8px 2px;font-weight:600;list-style-position:inside}
.who{font-size:.74rem;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:#8f4524}
details.doneBox .hint{font-size:.74rem;color:var(--muted);margin:-2px 2px 8px}
footer{margin-top:28px;font-size:.78rem;color:var(--muted);text-align:center;line-height:1.6}
footer a{color:var(--muted)}
.loading{text-align:center;color:var(--muted);padding:30px}
</style>
</head>
<body>
<main>
<header><h1>Household To-Do</h1><span id="status" class="busy">Loading…</span></header>

<div id="lists"><div class="loading">Gathering your list…</div></div>

<details class="doneBox" id="doneBox"><summary id="doneSum">Done</summary><div class="hint">Cleared 3 days after done</div><div class="card" id="doneList"></div></details>

<footer>
  Anyone with this link can see and edit this list.<br>
  <a id="dataLink" href="#" target="_blank" rel="noopener">Raw data (JSON)</a> · <a href="#" id="backup">Download backup</a>
</footer>
</main>

<script>
(function(){
"use strict";
const DATA_URL = document.querySelector('meta[name="household-data-url"]').content;
const OWNERS = ["Susanna","Derek","Shared"];
const TOMBSTONE_DAYS = 30;
const DONE_KEEP_DAYS = 3;   // checked-off items are removed this long after being checked
const POLL_MS = 15000;

let items = [];          // includes soft-deleted tombstones
let loaded = false;      // true after first successful read from backend
let editing = null;      // {id,text,owner,due} draft while an edit panel is open
let syncing = false, pending = false, timer = null, lastRendered = "";
let drag = null;         // drag-and-drop state while an item is being dragged; render() is paused meanwhile so polls can't interrupt it

const $ = s => document.querySelector(s);
const statusEl = $("#status");
function setStatus(kind, msg){ statusEl.className = kind; statusEl.textContent = msg; }

/* ---------- helpers ---------- */
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function fmtDue(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function clean(it){
  if(!it || typeof it.id!=="string") return null;
  const o = {
    id: it.id, text: String(it.text||"").slice(0,200),
    owner: OWNERS.includes(it.owner)? it.owner : "Shared",
    bucket: it.bucket==="Later"? "Later" : "Now",   // legacy field, no longer shown
    done: !!it.done, due: /^\d{4}-\d{2}-\d{2}$/.test(it.due||"") ? it.due : "",
    created: Number(it.created)||Number(it.updatedAt)||0,
    updatedAt: Number(it.updatedAt)||0, deleted: !!it.deleted
  };
  if(it.order!=null && it.order!=="" && isFinite(Number(it.order))) o.order = Number(it.order);   // manual position within owner list (see sortItems)
  if(o.done && Number(it.doneAt)>0) o.doneAt = Number(it.doneAt);   // when it was checked off (ms); absent on older items
  return o;
}
const doneTime = it => it.doneAt || it.updatedAt;   // fallback for items checked before doneAt existed
function pickNewer(a,b){
  if(!a) return b; if(!b) return a;
  if(a.updatedAt!==b.updatedAt) return a.updatedAt>b.updatedAt? a : b;
  if(a.deleted!==b.deleted) return a.deleted? a : b;          // tie: deletion wins
  return JSON.stringify(a) >= JSON.stringify(b) ? a : b;      // deterministic tie-break
}
function mergeAll(a,b,expire=true){
  const m=new Map();
  for(const it of [...a,...b]){ const c=clean(it); if(c) m.set(c.id, pickNewer(m.get(c.id), c)); }
  const now = Date.now(), cutoff = now - TOMBSTONE_DAYS*86400000, doneCutoff = now - DONE_KEEP_DAYS*86400000;
  if(expire) for(const it of m.values()){
    // done for more than 3 days -> tombstone with a fresh updatedAt so every device drops it
    if(it.done && !it.deleted && doneTime(it) < doneCutoff){ it.deleted = true; it.updatedAt = Math.max(now, it.updatedAt+1); }
  }
  return [...m.values()].filter(it => !(it.deleted && it.updatedAt < cutoff)).sort((x,y)=> x.id<y.id?-1:x.id>y.id?1:0);
}
const canon = arr => JSON.stringify(mergeAll(arr,[],false));   // no expiry here, so an expired item still counts as a difference to write back

/* ---------- backend ---------- */
async function readRemote(){
  const r = await fetch(DATA_URL, {cache:"no-store"});
  if(r.status===404) return [];
  if(!r.ok) throw new Error("read "+r.status);
  const t = (await r.text()).trim();
  if(!t) return [];
  let j; try{ j = JSON.parse(t); }catch(e){ throw new Error("unreadable data"); }   // never overwrite data we can't read
  if(!j || !Array.isArray(j.items)) throw new Error("unexpected data");
  return j.items;
}
async function writeRemote(arr){
  const r = await fetch(DATA_URL, {method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify({v:1, savedAt:Date.now(), items:arr})});
  if(!r.ok) throw new Error("write "+r.status);
}

/* sync = read latest -> merge with ours -> write if anything differs -> read back to confirm */
async function sync(){
  if(syncing){ pending=true; return; }
  syncing=true; pending=false;
  setStatus("busy","Syncing…");
  try{
    for(let i=0;i<4;i++){
      const remote = await readRemote();
      const merged = mergeAll(items, remote);
      items = merged;
      loaded = true;
      if(canon(remote)===canon(merged)) break;   // backend already has everything
      setStatus("busy","Saving…");
      await writeRemote(merged);
      if(i===3) throw new Error("busy, will retry");
    }
    setStatus("ok","Saved");
  }catch(e){
    setStatus("bad", navigator.onLine===false ? "Offline — will retry" : "Couldn’t sync — retrying");
    pending = true; clearTimeout(timer); timer=setTimeout(()=>{timer=null;sync();},5000);
  }finally{
    syncing=false; render();
    if(pending && !timer){ timer=setTimeout(()=>{timer=null;sync();},400); }
  }
}
function schedule(){ clearTimeout(timer); timer=setTimeout(()=>{timer=null;sync();},350); render(); setStatus("busy","Saving…"); }

/* ---------- mutations ---------- */
function bump(it, patch){
  if(it.done && !it.doneAt && !("done" in patch)) patch.doneAt = it.updatedAt;   // pin the fallback so edits don't extend the 3 days
  Object.assign(it, patch, {updatedAt: Math.max(Date.now(), it.updatedAt+1)}); }
function touch(it, patch){ bump(it, patch); schedule(); }
const byId = id => items.find(i=>i.id===id);

/* ---------- rendering ---------- */
/* SORTING RULE (per owner list, not-done items): by `order` ascending, tie-break by `created` ascending.
   `order` is a number set when an item is dragged / moved (the affected owner list is renumbered 1..n).
   Items that have no `order` yet (never moved) sort AFTER items that have one, using the original default:
   due date (earliest first, undated last) then `created`. The first move in a list gives every item in it an `order`.
   Every change to `order`/`owner` also bumps `updatedAt`, so the newest-wins merge keeps the new arrangement. */
function sortItems(a,b){
  const ha = a.order!=null, hb = b.order!=null;
  if(ha!==hb) return ha? -1 : 1;
  if(ha){ if(a.order!==b.order) return a.order-b.order; return a.created-b.created; }
  if(a.due!==b.due){ if(!a.due) return 1; if(!b.due) return -1; return a.due<b.due?-1:1; }
  return a.created-b.created;
}
const openItems = owner => items.filter(i=>!i.deleted && !i.done && i.owner===owner).sort(sortItems);

/* Set the order of one owner list to `ids` (top to bottom), renumbering 1..n. If movedId is given and was in
   another list it joins this one. Only items whose order/owner actually change are touched (updatedAt bumped). */
function commitOrder(owner, ids, movedId){
  const seen = new Set(), list = [];
  for(const id of ids){
    const it = byId(id);
    if(it && !it.deleted && !it.done && !seen.has(id) && (it.owner===owner || id===movedId)){ list.push(it); seen.add(id); }
  }
  // anything that landed in this list meanwhile (e.g. arrived via a poll mid-drag) is kept, at the end
  for(const it of openItems(owner)) if(!seen.has(it.id) && it.id!==movedId) list.push(it);
  let changed = false;
  list.forEach((it,i)=>{
    const patch = {};
    if(it.order!==i+1) patch.order = i+1;
    if(it.owner!==owner) patch.owner = owner;
    if(Object.keys(patch).length){ bump(it, patch); changed = true; }
  });
  if(changed) schedule();
  return changed;
}
function moveBy(id, delta){
  const it = byId(id); if(!it || it.done || it.deleted) return;
  const ids = openItems(it.owner).map(i=>i.id), i = ids.indexOf(id), j = i+delta;
  if(i<0 || j<0 || j>=ids.length) return;
  ids.splice(i,1); ids.splice(j,0,id);
  commitOrder(it.owner, ids, null);
  render(true);
}
function el(tag, props, ...kids){
  const e=document.createElement(tag);
  if(props) for(const k in props){ if(k==="class") e.className=props[k]; else if(k.startsWith("on")) e.addEventListener(k.slice(2),props[k]); else e.setAttribute(k,props[k]); }
  for(const k of kids) if(k!=null) e.append(k);
  return e;
}
function opt(list,sel){ return list.map(v=>{const o=el("option",{value:v},v); if(v===sel) o.selected=true; return o;}); }

function itemRow(it, showWho){
  const today = todayStr();
  const over = !it.done && it.due && it.due < today;
  const isToday = !it.done && it.due === today;
  const row = el("div",{class:"item"+(it.done?" done":"")+(over?" overdue":"")});
  const chk = el("button",{class:"chk",type:"button","aria-label":(it.done?"Mark not done: ":"Mark done: ")+it.text,onclick:()=>{ if(it.done){ delete it.doneAt; touch(it,{done:false}); } else touch(it,{done:true,doneAt:Date.now()}); }}, el("i",null,it.done?"✓":""));
  const meta = el("div",{class:"meta"});
  if(showWho) meta.append(el("span",{class:"who"},it.owner));
  if(it.due) meta.append(el("span",{class:"chip"+(over?" over":isToday?" today":"")}, (over?"Overdue · ":isToday?"Today · ":"Due ")+fmtDue(it.due)));
  const body = el("button",{class:"body",type:"button","aria-label":"Edit: "+it.text,onclick:()=>{ editing = editing&&editing.id===it.id ? null : {id:it.id,text:it.text,owner:it.owner,due:it.due}; render(true); }},
    el("div",{class:"txt"},it.text), meta.childNodes.length? meta : null);
  row.append(chk, body);
  if(!it.done){
    const grip = el("button",{class:"grip",type:"button","aria-label":"Move: "+it.text+". Drag, or use the up and down arrow keys."},el("span",null,"⋮⋮"));
    grip.addEventListener("pointerdown", e=>startDrag(e,it.id,grip));
    grip.addEventListener("contextmenu", e=>e.preventDefault());
    grip.addEventListener("keydown", e=>{
      if(e.key==="ArrowUp"||e.key==="ArrowDown"){ e.preventDefault(); moveBy(it.id, e.key==="ArrowUp"?-1:1);
        setTimeout(()=>{ const g=document.querySelector('.iw[data-id="'+it.id+'"] .grip'); if(g) g.focus(); },0); }
    });
    row.append(grip);
  }
  const wrap = el("div",it.done?null:{class:"iw","data-id":it.id},row);
  if(editing && editing.id===it.id){
    const t = el("input",{type:"text",maxlength:"200",value:editing.text,"aria-label":"Task text",oninput:e=>editing.text=e.target.value});
    const o = el("select",{"aria-label":"Whose",onchange:e=>editing.owner=e.target.value},...opt(OWNERS,editing.owner));
    const d = el("input",{type:"date",value:editing.due,"aria-label":"Due date",onchange:e=>editing.due=e.target.value});
    const save = ()=>{ const txt=editing.text.trim(); if(!txt) return; const cur=byId(editing.id); const e=editing; editing=null; if(!cur) return;
      if(!cur.done && e.owner!==cur.owner){ commitOrder(e.owner, [...openItems(e.owner).map(i=>i.id), cur.id], cur.id); touch(cur,{text:txt,due:e.due}); }   // moved via the picker: goes to the end of that list
      else touch(cur,{text:txt,owner:e.owner,due:e.due}); };
    t.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();save();} if(e.key==="Escape"){editing=null;render(true);} });
    const mv = it.done? null : el("div",{class:"btns"}, el("span",{class:"mvlbl"},"Move in list"),
        el("button",{type:"button",class:"mv","aria-label":"Move up",onclick:()=>moveBy(it.id,-1)},"↑"),
        el("button",{type:"button",class:"mv","aria-label":"Move down",onclick:()=>moveBy(it.id,1)},"↓"));
    wrap.append(el("div",{class:"edit"}, t, el("div",{class:"row3"},o,d), mv,
      el("div",{class:"btns"},
        el("button",{type:"button",class:"save",onclick:save},"Save"),
        el("button",{type:"button",onclick:()=>{editing=null;render(true);}},"Cancel"),
        el("button",{type:"button",class:"del",onclick:()=>{ if(confirm("Delete this task?")){ const cur=byId(it.id); editing=null; if(cur) touch(cur,{deleted:true}); } }},"Delete"))));
    setTimeout(()=>{ const x=wrap.querySelector("input[type=text]"); if(x && document.activeElement!==x && !wrap.dataset.f){ x.focus(); } },0);
  }
  return wrap;
}

function syncEmpty(card){ const e=card.querySelector(":scope>.empty"); if(e) e.hidden = !!card.querySelector(":scope>.iw:not(.lifted),:scope>.ph"); }

/* ---------- drag and drop (Pointer Events; mouse + touch; handle-only so normal scrolling still works) ---------- */
function cardsEls(){ return [...document.querySelectorAll("#lists .card[data-owner]")]; }
function pickCard(y){
  const secs = cardsEls().map(c=>c.parentNode);
  let pick = secs[0];
  for(const s of secs){ if(y >= s.getBoundingClientRect().top) pick = s; }   // the section whose band the pointer is in (clamped at both ends)
  return pick.querySelector(".card");
}
function placeDrag(){
  if(!drag) return;
  const card = pickCard(drag.y);
  drag.wrap.style.top = (drag.y - drag.dy) + "px";   // the dragged row floats with the pointer (position:fixed); a placeholder marks the drop slot
  const rows = [...card.querySelectorAll(":scope>.iw")].filter(r=>r!==drag.wrap);
  let ref = null;
  for(const r of rows){ const b=r.getBoundingClientRect(); if(drag.y < b.top + b.height/2){ ref=r; break; } }
  if(!ref) ref = card.querySelector(":scope>.empty");   // append before the (hidden) empty marker
  if(drag.ph.parentNode!==card || drag.ph.nextSibling!==ref) card.insertBefore(drag.ph, ref);
  for(const c of cardsEls()){ c.classList.toggle("target", c===card); syncEmpty(c); }
}
function dragLoop(){
  if(!drag) return;
  const h = window.innerHeight, edge = 70;
  let dy = 0;
  if(drag.y < edge) dy = -Math.ceil((edge-drag.y)/5); else if(drag.y > h-edge) dy = Math.ceil((drag.y-(h-edge))/5);
  if(dy){ window.scrollBy(0, dy); placeDrag(); }
  drag.raf = requestAnimationFrame(dragLoop);
}
const stopTouch = e=>{ if(e.cancelable) e.preventDefault(); };
function startDrag(e,id,grip){
  if(drag || (e.pointerType==="mouse" && e.button!==0)) return;
  const wrap = grip.closest(".iw"); if(!wrap) return;
  e.preventDefault();
  try{ grip.setPointerCapture(e.pointerId); }catch(_){}
  const rc = wrap.getBoundingClientRect(), ph = el("div",{class:"ph"});
  ph.style.height = rc.height+"px";
  drag = {id, wrap, grip, ph, dy:e.clientY-rc.top, pid:e.pointerId, y:e.clientY, raf:0};
  wrap.parentNode.insertBefore(ph, wrap);
  wrap.style.left = rc.left+"px"; wrap.style.width = rc.width+"px"; wrap.style.top = rc.top+"px";
  wrap.classList.add("lifted"); document.body.classList.add("dragging");
  document.addEventListener("touchmove", stopTouch, {passive:false});
  grip.addEventListener("pointermove", onDragMove);
  grip.addEventListener("pointerup", onDragEnd);
  grip.addEventListener("pointercancel", onDragCancel);
  grip.addEventListener("lostpointercapture", onDragCancel);
  document.addEventListener("keydown", onDragKey);
  placeDrag(); drag.raf = requestAnimationFrame(dragLoop);
}
function onDragMove(e){ if(!drag || e.pointerId!==drag.pid) return; drag.y = e.clientY; placeDrag(); }
function endDrag(){
  const d = drag; if(!d) return null;
  cancelAnimationFrame(d.raf);
  document.removeEventListener("touchmove", stopTouch);
  document.removeEventListener("keydown", onDragKey);
  for(const t of ["pointermove","pointerup","pointercancel","lostpointercapture"]) d.grip.removeEventListener(t, {pointermove:onDragMove,pointerup:onDragEnd,pointercancel:onDragCancel,lostpointercapture:onDragCancel}[t]);
  try{ d.grip.releasePointerCapture(d.pid); }catch(_){}
  document.body.classList.remove("dragging");
  drag = null;   // render() works again
  return d;
}
function onDragEnd(e){
  if(!drag || e.pointerId!==drag.pid) return;
  const card = drag.ph.parentNode, owner = card && card.dataset ? card.dataset.owner : null;
  const ids = owner ? [...card.children].map(r=> r===drag.ph? drag.id : (r.classList.contains("iw") && r!==drag.wrap ? r.dataset.id : null)).filter(Boolean) : [];
  const id = drag.id;
  endDrag();
  if(owner){
    if(editing && editing.id===id) editing.owner = owner;   // keep an open editor in step with the move
    commitOrder(owner, ids, id);
  }
  render(true);
}
function onDragCancel(e){ if(!drag || (e.pointerId!==undefined && e.pointerId!==drag.pid)) return; endDrag(); render(true); }
function onDragKey(e){ if(e.key==="Escape"){ endDrag(); render(true); } }

function render(force){
  if(drag) return;   // a drag is in progress: never rebuild the DOM under the user's finger (drop/cancel re-renders)
  const live = items.filter(i=>!i.deleted);
  const sig = JSON.stringify(live)+"|"+(editing?editing.id:"")+"|"+loaded;
  if(!force){
    if(sig===lastRendered) return;
    if(editing && lastRendered.indexOf("|"+editing.id+"|")>-1) { lastRendered=sig; return; }  // don't disturb an open editor
  }
  lastRendered = sig;
  const lists = $("#lists");
  lists.replaceChildren();
  if(!loaded){ lists.append(el("div",{class:"loading"},"Gathering your list…")); $("#doneBox").hidden=true; return; }
  for(const owner of OWNERS){
    const mine = live.filter(i=>i.owner===owner && !i.done);
    const sec = el("section",{class:"owner"}, el("h2",null,owner,el("span",{class:"count"},mine.length? mine.length+" to do":"")));
    const card = el("div",{class:"card","data-owner":owner});
    mine.sort(sortItems).forEach(r=>card.append(itemRow(r,false)));
    card.append(el("div",{class:"empty"},"All clear here. Nice."));   // always present, shown only while the list has no items (also the drop zone)
    syncEmpty(card);
    sec.append(card); lists.append(sec);
  }
  const done = live.filter(i=>i.done).sort((a,b)=>b.updatedAt-a.updatedAt);
  $("#doneBox").hidden = done.length===0;
  $("#doneSum").textContent = "Done ("+done.length+")";
  const dl = $("#doneList"); dl.replaceChildren();
  done.forEach(r=>dl.append(itemRow(r,true)));
}

/* ---------- wiring ---------- */
$("#dataLink").href = DATA_URL;
$("#backup").addEventListener("click", e=>{
  e.preventDefault();
  const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),items:items.filter(i=>!i.deleted)},null,2)],{type:"application/json"});
  const a=el("a",{href:URL.createObjectURL(blob),download:"household-todo-backup.json"}); document.body.append(a); a.click(); a.remove();
});
window.__household = { dataUrl: DATA_URL, sync, get items(){ return items; } };

setInterval(()=>{ if(!document.hidden) sync(); }, POLL_MS);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) sync(); });
window.addEventListener("focus", ()=>sync());
window.addEventListener("online", ()=>sync());
render(true);
sync();
})();
</script>
</body>
